# @package task
# Absolute nominal offsets (rad), filtered by the joint reference model.
robot:
  finger_stiffness: 20.0
  finger_damping: 0.5  # all finger damping is in actuator Kd
  finger_armature: 0.01
  finger_passive_damping: 0.0
input:
  wrist:
    _target_: dex_track.WristVelocityWrench
    linear_speed: 0.5
    angular_speed: 2.0
    kp_pos: 350.0
    kd_pos: 25.0
    kp_rot: 40.0
    kd_rot: 0.3
    max_force: 100.0
    max_torque: 10.0
    desired_velocity_feedforward: false
  finger:
    _target_: dex_track.FingerFilteredPosition
    nominal:
      right_hand_index_bend_joint: 0.0
      right_hand_index_joint1: 0.55
      right_hand_index_joint2: 0.45
      right_hand_mid_joint1: 0.55
      right_hand_mid_joint2: 0.45
      right_hand_ring_joint1: 0.55
      right_hand_ring_joint2: 0.45
      right_hand_pinky_joint1: 0.55
      right_hand_pinky_joint2: 0.45
      right_hand_thumb_bend_joint: 0.55
      right_hand_thumb_rota_joint1: 0.4
      right_hand_thumb_rota_joint2: 0.35
      left_hand_index_bend_joint: 0.0
      left_hand_index_joint1: 0.55
      left_hand_index_joint2: 0.45
      left_hand_mid_joint1: 0.55
      left_hand_mid_joint2: 0.45
      left_hand_ring_joint1: 0.55
      left_hand_ring_joint2: 0.45
      left_hand_pinky_joint1: 0.55
      left_hand_pinky_joint2: 0.45
      left_hand_thumb_bend_joint: 0.55
      left_hand_thumb_rota_joint1: 0.4
      left_hand_thumb_rota_joint2: 0.35
    action_scale: 0.5
    # second-order reference prefilter on the finger PD targets (position + velocity)
    omega: 20.0
    zeta: 1.0
