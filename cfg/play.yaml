# Playback uses the same task/algo groups and field overrides as train.yaml.
defaults:
  - train
  - _self_

hydra:
  run:
    dir: ./outputs/play/${now:%Y-%m-%d}/${now:%H-%M-%S}-${task.name}-${algo.name}
  job:
    chdir: false

headless: false
seed: 0
record_video: false
realtime: true
eval_steps: null
save_scene: false
contact_reports: false
output_dir: outputs/dex-play
app:
  headless: ${..headless}
  enable_cameras: ${..record_video}
task:
  viewer:
    eye: [0.55, -0.65, 0.48]
    lookat: [0.0, 0.0, 0.18]
  num_envs: 16
  input:
    wrist:
      desired_velocity_feedforward: false
  command:
    sampling: start
wandb:
  mode: disabled
